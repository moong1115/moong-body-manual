<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>MOONG BODY MANUAL · 클릭형 몸 지도</title>
<style>
:root{--bg:#07111f;--card:#0d1b2f;--line:#203652;--text:#f6f8fb;--muted:#9fb0c6;--accent:#8ab4ff;--danger:#ff8f9b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#050d19,#091525 45%,#07111f);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 15px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.12em}.top h1{font-size:25px;margin:5px 0}.top a,.btn{border:1px solid var(--line);background:#152944;color:#dce7f5;border-radius:11px;padding:9px 12px;text-decoration:none;font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:15px}.card{background:rgba(13,27,47,.95);border:1px solid var(--line);border-radius:20px;padding:17px}.stage{position:relative;min-height:650px;border:1px solid rgba(138,180,255,.24);border-radius:22px;background:radial-gradient(ellipse at 50% 45%,rgba(28,59,94,.68),rgba(8,21,37,.97) 70%);display:flex;flex-direction:column;align-items:center;overflow:hidden}.stageHead{width:100%;padding:14px 15px 0;display:flex;justify-content:space-between;align-items:center;color:#d6e4f7;font-size:11px;font-weight:800;letter-spacing:.1em}.stageHead button{font-size:11px}.bodySvg{width:min(100%,430px);height:565px}.hotspot{cursor:pointer;outline:none}.zone{fill:rgba(138,180,255,.08);stroke:rgba(220,235,255,.3);stroke-width:1.6;transition:.16s}.hotspot:hover .zone,.hotspot:focus-visible .zone{fill:rgba(138,180,255,.38);stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(138,180,255,.8))}.hotspot.selected .zone{fill:rgba(138,180,255,.55);stroke:#fff;stroke-width:3}.hotspot.recorded .zone{fill:rgba(255,135,148,.23);stroke:rgba(255,155,165,.9)}.back{display:none}.stage.back .front{display:none}.stage.back .back{display:inline}.info h2{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.selected{border:1px solid var(--line);border-radius:15px;background:#081525;padding:15px;margin-bottom:12px}.selected h2{font-size:20px}.selected button{width:100%;margin-top:10px;border:0;background:var(--accent);color:#07111f;border-radius:11px;padding:11px;font-weight:800}.selected button:disabled{opacity:.45}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.quick button{border:1px solid var(--line);background:#0a1728;color:#dce7f5;border-radius:10px;padding:9px 4px;font-size:12px}.quick button.active{background:var(--accent);color:#07111f;font-weight:800}.records{margin-top:12px}.record{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.record:last-child{border-bottom:0}.dot{display:inline-block;width:8px;height:8px;background:var(--danger);border-radius:50%;margin-right:5px}@media(max-width:800px){.layout{grid-template-columns:1fr}.stage{min-height:560px}.bodySvg{height:490px}}@media(max-width:500px){.top{align-items:flex-start}.top a{font-size:11px}.stage{min-height:510px}.bodySvg{height:445px}.quick{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="eyebrow">MOONG BODY MANUAL · BODY MAP</div><h1>클릭형 몸 지도</h1><div class="muted">몸의 부위를 직접 눌러 최근 통증 기록을 확인하세요.</div></div><a href="./">← 메인으로</a></div>
<div class="layout"><div class="card"><div class="stage" id="stage"><div class="stageHead"><span id="side">FRONT · 앞면</span><button class="btn" id="flip">앞/뒤 전환 ↻</button></div>
<svg class="bodySvg" viewBox="0 0 360 590" role="group" aria-label="앞면 인체 몸지도">
<defs><linearGradient id="fill" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#dce9ff"/><stop offset=".48" stop-color="#91b6e8"/><stop offset="1" stop-color="#547aa9"/></linearGradient></defs>
<g class="front"><g fill="url(#fill)" stroke="#bcd5f5" stroke-width="2"><path d="M159 91C146 96 132 103 119 114C110 122 103 134 99 149L75 218C70 233 76 243 87 243C96 243 101 234 105 220L129 157L131 220C132 241 127 263 119 281C129 298 150 306 180 306C210 306 231 298 241 281C233 263 228 241 229 220L231 157L255 220C259 234 264 243 273 243C284 243 290 233 285 218L261 149C257 134 250 122 241 114C228 103 214 96 201 91L193 118Q180 127 167 118Z"/><path d="M132 292C131 323 135 357 142 389L132 493Q131 506 142 509L159 509L179 383L180 306Z"/><path d="M228 292C229 323 225 357 218 389L228 493Q229 506 218 509L201 509L181 383L180 306Z"/><path d="M142 505L132 520Q130 526 138 527L163 527Q170 526 169 520L159 505M218 505L228 520Q230 526 222 527L197 527Q190 526 191 520L201 505"/><path d="M159 91C160 82 160 76 160 71L200 71C200 78 200 84 201 91L194 118Q180 127 166 118Z"/><ellipse cx="180" cy="49" rx="31" ry="35"/></g>
<g class="hotspot" tabindex="0" role="button" data-area="머리"><ellipse class="zone" cx="180" cy="49" rx="35" ry="39"/></g><g class="hotspot" tabindex="0" role="button" data-area="목"><ellipse class="zone" cx="180" cy="99" rx="25" ry="18"/></g><g class="hotspot" tabindex="0" role="button" data-area="어깨"><ellipse class="zone" cx="126" cy="130" rx="32" ry="25"/><ellipse class="zone" cx="234" cy="130" rx="32" ry="25"/></g><g class="hotspot" tabindex="0" role="button" data-area="가슴"><ellipse class="zone" cx="180" cy="164" rx="45" ry="31"/></g><g class="hotspot" tabindex="0" role="button" data-area="복부"><ellipse class="zone" cx="180" cy="225" rx="42" ry="47"/></g><g class="hotspot" tabindex="0" role="button" data-area="왼쪽 골반"><ellipse class="zone" cx="151" cy="281" rx="27" ry="23"/></g><g class="hotspot" tabindex="0" role="button" data-area="오른쪽 골반"><ellipse class="zone" cx="209" cy="281" rx="27" ry="23"/></g><g class="hotspot" tabindex="0" role="button" data-area="무릎"><ellipse class="zone" cx="150" cy="393" rx="22" ry="23"/><ellipse class="zone" cx="210" cy="393" rx="22" ry="23"/></g><g class="hotspot" tabindex="0" role="button" data-area="발목"><ellipse class="zone" cx="148" cy="493" rx="20" ry="20"/><ellipse class="zone" cx="212" cy="493" rx="20" ry="20"/></g></g>
<g class="back"><g fill="url(#fill)" stroke="#bcd5f5" stroke-width="2"><path d="M159 91C146 96 132 103 119 114C110 122 103 134 99 149L75 218C70 233 76 243 87 243C96 243 101 234 105 220L129 157L131 220C132 241 127 263 119 281C129 298 150 306 180 306C210 306 231 298 241 281C233 263 228 241 229 220L231 157L255 220C259 234 264 243 273 243C284 243 290 233 285 218L261 149C257 134 250 122 241 114C228 103 214 96 201 91L193 118Q180 127 167 118Z"/><path d="M132 292C131 323 135 357 142 389L132 493Q131 506 142 509L159 509L179 383L180 306Z"/><path d="M228 292C229 323 225 357 218 389L228 493Q229 506 218 509L201 509L181 383L180 306Z"/><ellipse cx="180" cy="49" rx="31" ry="35"/></g>
<g class="hotspot" tabindex="0" role="button" data-area="목"><ellipse class="zone" cx="180" cy="99" rx="25" ry="18"/></g><g class="hotspot" tabindex="0" role="button" data-area="어깨"><ellipse class="zone" cx="126" cy="130" rx="32" ry="25"/><ellipse class="zone" cx="234" cy="130" rx="32" ry="25"/></g><g class="hotspot" tabindex="0" role="button" data-area="등"><ellipse class="zone" cx="180" cy="191" rx="48" ry="43"/></g><g class="hotspot" tabindex="0" role="button" data-area="허리"><ellipse class="zone" cx="180" cy="258" rx="40" ry="24"/></g><g class="hotspot" tabindex="0" role="button" data-area="왼쪽 골반"><ellipse class="zone" cx="151" cy="281" rx="27" ry="23"/></g><g class="hotspot" tabindex="0" role="button" data-area="오른쪽 골반"><ellipse class="zone" cx="209" cy="281" rx="27" ry="23"/></g><g class="hotspot" tabindex="0" role="button" data-area="무릎"><ellipse class="zone" cx="150" cy="393" rx="22" ry="23"/><ellipse class="zone" cx="210" cy="393" rx="22" ry="23"/></g><g class="hotspot" tabindex="0" role="button" data-area="발목"><ellipse class="zone" cx="148" cy="493" rx="20" ry="20"/><ellipse class="zone" cx="212" cy="493" rx="20" ry="20"/></g></g>
</svg></div></div>
<div class="card info"><div class="selected"><div class="muted">SELECTED AREA</div><h2 id="selected">부위를 선택하세요</h2><div class="muted" id="summary">그림의 부위를 눌러 주세요.</div><button id="record" disabled>이 부위 통증 기록하기</button></div><div class="muted" style="margin-bottom:8px">빠른 선택</div><div class="quick" id="quick"></div><div class="records" id="records"></div></div></div>
</div>
<script>
const $=s=>document.querySelector(s);const pain=()=>{try{const x=JSON.parse(localStorage.getItem('moong_pain')||'[]');return Array.isArray(x)?x:[]}catch{return[]}};let area='';
const areas=['머리','목','어깨','가슴','등','허리','복부','골반','왼쪽 골반','오른쪽 골반','무릎','발목','기타'];
function matches(x,a){if(x===a)return true;if(x==='목·어깨'&&(a==='목'||a==='어깨'))return true;if(a==='골반'&&(x==='왼쪽 골반'||x==='오른쪽 골반'))return true;return false}
function selectArea(a){area=a;document.querySelectorAll('.hotspot').forEach(x=>x.classList.toggle('selected',x.dataset.area===a));document.querySelectorAll('#quick button').forEach(x=>x.classList.toggle('active',x.dataset.area===a));render()}
function render(){const data=pain(),rows=data.filter(x=>matches(x.area||'기타',area)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,8);$('#selected').textContent=area||'부위를 선택하세요';$('#summary').textContent=area?(rows.length?'최근 기록 '+rows.length+'건을 찾았습니다.':'아직 이 부위의 통증 기록이 없습니다.'):'그림의 부위를 눌러 주세요.';$('#record').disabled=!area;$('#records').innerHTML=rows.length?rows.map(x=>'<div class="record"><span class="dot"></span><b>'+String(x.date||'날짜 미기록')+'</b> · '+String(x.type||'종류 미기록')+' · '+(x.score==null?'강도 미기록':x.score+'/10')+(x.note?'<br><span class="muted">'+String(x.note)+'</span>':'')+'</div>').join(''):'<div class="muted">선택한 부위의 최근 통증 기록이 없습니다.</div>';document.querySelectorAll('.hotspot').forEach(x=>{x.classList.toggle('recorded',data.some(r=>matches(r.area||'기타',x.dataset.area)))})}
$('#quick').innerHTML=areas.map(a=>'<button type="button" data-area="'+a+'">'+a+'</button>').join('');document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>selectArea(b.dataset.area));document.querySelectorAll('.hotspot').forEach(b=>{b.onclick=()=>selectArea(b.dataset.area);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectArea(b.dataset.area)}}});
$('#flip').onclick=()=>{$('#stage').classList.toggle('back');const back=$('#stage').classList.contains('back');$('#side').textContent=back?'BACK · 뒷면':'FRONT · 앞면'};
$('#record').onclick=()=>{if(!area)return;localStorage.setItem('moong_bodymap_selected',area);location.href='./#mood';};render();
</script></body></html>
